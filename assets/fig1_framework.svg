<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 454" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="card-shadow" x="-8%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="output-shadow" x="-8%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.14"/>
    </filter>
    <filter id="eqp-shadow" x="-4%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b45309" flood-opacity="0.08"/>
    </filter>

    <!-- Header Gradients -->
    <linearGradient id="header-grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="header-grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="header-grad-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-main-head" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,3.5 L1,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-branch-head" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,3.5 L1,6 Z" fill="#d97706"/>
    </marker>

    <style>
      .node-main { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.4; filter: url(#card-shadow); }
      .node-output { fill: #ffffff; stroke: #10b981; stroke-width: 2.0; filter: url(#output-shadow); }
      .node-eqp { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 6 3; filter: url(#eqp-shadow); }

      .header-bg-main { fill: url(#header-grad-blue); stroke: #bfdbfe; stroke-width: 1; }
      .header-bg-output { fill: url(#header-grad-green); stroke: #a7f3d0; stroke-width: 1; }
      .header-bg-eqp { fill: url(#header-grad-amber); stroke: #fde68a; stroke-width: 1; }

      .step-tag { font-size: 14px; font-weight: 700; fill: #1e40af; letter-spacing: 0.4px; }
      .step-tag-out { font-size: 14px; font-weight: 700; fill: #065f46; letter-spacing: 0.4px; }
      .step-tag-eqp { font-size: 14px; font-weight: 700; fill: #92400e; letter-spacing: 0.4px; }

      .card-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .card-title-out { font-size: 17px; font-weight: 800; fill: #064e3b; }
      .card-title-eqp { font-size: 17px; font-weight: 700; fill: #78350f; }

      .card-sub { font-size: 15px; fill: #2563eb; font-weight: 600; font-style: italic; }
      .card-sub-muted { font-size: 15px; fill: #64748b; }
      .card-desc { font-size: 15px; fill: #334155; }

      .eqp-desc { font-size: 15px; fill: #92400e; font-weight: 500; }
      .eqp-sub { font-size: 15px; fill: #b45309; font-style: italic; }

      .arrow-main { stroke: #2563eb; stroke-width: 2.0; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-main-head); }
      .arrow-branch { stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; stroke-linecap: round; marker-end: url(#arrow-branch-head); }
    </style>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="650" height="454" fill="#ffffff" rx="10"/>

  <!-- ==================== PIPELINE ROW 1 (STEPS 1-3) ==================== -->

  <!-- Node 1: Abnormal EQP (Input) [x=14.5..209.5, center=112] -->
  <g transform="translate(14.5, 14)">
    <rect class="node-main" width="195" height="200" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">STEP 1 · INPUT</text>
    <text class="card-title" x="97.5" y="76" text-anchor="middle" dominant-baseline="central">Abnormal EQP</text>
    <text class="card-sub-muted" x="97.5" y="108" text-anchor="middle" dominant-baseline="central">(Target Equipment)</text>
    <text class="card-desc" x="97.5" y="140" text-anchor="middle" dominant-baseline="central">Flagged by upstream</text>
    <text class="card-desc" x="97.5" y="164" text-anchor="middle" dominant-baseline="central">monitoring / SPC</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line class="arrow-main" x1="211.5" y1="114" x2="226.5" y2="114"/>

  <!-- Node 2: Global KPI Model [x=227.5..422.5, center=325] -->
  <g transform="translate(227.5, 14)">
    <rect class="node-main" width="195" height="200" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">STEP 2 · MODELING</text>
    <text class="card-title" x="97.5" y="76" text-anchor="middle" dominant-baseline="central">Global KPI Model</text>
    <text class="card-sub" x="97.5" y="108" text-anchor="middle" dominant-baseline="central">f(<tspan font-weight="700" font-style="normal">x</tspan>, g)</text>
    <text class="card-desc" x="97.5" y="140" text-anchor="middle" dominant-baseline="central">5-fold cross-fitting</text>
    <text class="card-desc" x="97.5" y="164" text-anchor="middle" dominant-baseline="central">all equipment pool</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line class="arrow-main" x1="424.5" y1="114" x2="439.5" y2="114"/>

  <!-- Node 3: OOF SHAP Attributions [x=440.5..635.5, center=538] -->
  <g transform="translate(440.5, 14)">
    <rect class="node-main" width="195" height="200" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">STEP 3 · ATTRIBUTION</text>
    <text class="card-title" x="97.5" y="76" text-anchor="middle" dominant-baseline="central">OOF SHAP Values</text>
    <text class="card-sub-muted" x="97.5" y="108" text-anchor="middle" dominant-baseline="central">attribution distribution</text>
    <text class="card-desc" x="97.5" y="140" text-anchor="middle" dominant-baseline="central">Held-out rows only</text>
    <text class="card-desc" x="97.5" y="164" text-anchor="middle" dominant-baseline="central">avoids in-sample bias</text>
  </g>

  <!-- ==================== PIPELINE ROW 2 (STEPS 4-5) ==================== -->

  <!-- Wrap arrow from Node 3 to Node 4 (down, across the inter-row gap, down) -->
  <path class="arrow-main" d="M 500,214 L 500,227 L 112,227 L 112,239"/>

  <!-- Node 4: Wasserstein Metric [x=14.5..209.5, center=112] -->
  <g transform="translate(14.5, 240)">
    <rect class="node-main" width="195" height="200" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">STEP 4 · DISTANCE</text>
    <text class="card-title" x="97.5" y="76" text-anchor="middle" dominant-baseline="central">Wasserstein Metric</text>
    <text class="card-sub-muted" x="97.5" y="108" text-anchor="middle" dominant-baseline="central">distribution divergence</text>
    <text class="card-desc" x="97.5" y="140" text-anchor="middle" dominant-baseline="central">Abnormal vs. normal</text>
    <text class="card-desc" x="97.5" y="164" text-anchor="middle" dominant-baseline="central">feature-wise profiles</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line class="arrow-main" x1="211.5" y1="340" x2="226.5" y2="340"/>

  <!-- Node 5: Candidate Ranking (Output) [x=227.5..422.5, center=325] -->
  <g transform="translate(227.5, 240)">
    <rect class="node-output" width="195" height="200" rx="9"/>
    <path class="header-bg-output" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag-out" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">PRIMARY OUTPUT</text>
    <text class="card-title-out" x="97.5" y="76" text-anchor="middle" dominant-baseline="central">Candidate Ranking</text>
    <text class="card-sub-muted" x="97.5" y="108" text-anchor="middle" dominant-baseline="central">ranked process features</text>
    <text class="card-desc" x="97.5" y="140" text-anchor="middle" dominant-baseline="central">Known-equipment</text>
    <text class="card-desc" x="97.5" y="164" text-anchor="middle" dominant-baseline="central">root-cause diagnosis</text>
  </g>

  <!-- ==================== EQP BRANCH ==================== -->

  <!-- Branch arrow from Node 3 (center x=538) straight down into the EQP channel -->
  <path class="arrow-branch" d="M 538,214 L 538,239"/>

  <!-- Node EQP: separate reported channel [x=440.5..635.5, center=538] -->
  <g transform="translate(440.5, 240)">
    <rect class="node-eqp" width="195" height="200" rx="9"/>
    <path class="header-bg-eqp" d="M 0,9 Q 0,0 9,0 L 186,0 Q 195,0 195,9 L 195,38 L 0,38 Z"/>
    <text class="step-tag-eqp" x="97.5" y="19" text-anchor="middle" dominant-baseline="central">SEPARATE CHANNEL</text>

    <text class="card-title-eqp" x="97.5" y="74" text-anchor="middle" dominant-baseline="central">EQP Attribution</text>
    <text class="card-title-eqp" x="97.5" y="95" text-anchor="middle" dominant-baseline="central">Channel</text>
    <text class="eqp-desc" x="97.5" y="121" text-anchor="middle" dominant-baseline="central">Model-dependent</text>
    <text class="eqp-desc" x="97.5" y="141" text-anchor="middle" dominant-baseline="central">unexplained equipment-</text>
    <text class="eqp-desc" x="97.5" y="161" text-anchor="middle" dominant-baseline="central">association readout</text>
    <text class="eqp-sub" x="97.5" y="181" text-anchor="middle" dominant-baseline="central">excluded from ranking</text>
  </g>
</svg>
