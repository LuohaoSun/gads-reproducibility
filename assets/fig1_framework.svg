<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="card-shadow" x="-8%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="output-shadow" x="-8%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.14"/>
    </filter>
    <filter id="eqp-shadow" x="-4%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b45309" flood-opacity="0.08"/>
    </filter>

    <!-- Header Gradients -->
    <linearGradient id="header-grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="header-grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="header-grad-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-main-head" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,3.5 L1,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-branch-head" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,3.5 L1,6 Z" fill="#d97706"/>
    </marker>

    <style>
      .node-main { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.4; filter: url(#card-shadow); }
      .node-output { fill: #ffffff; stroke: #10b981; stroke-width: 2.0; filter: url(#output-shadow); }
      .node-eqp { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 6 3; filter: url(#eqp-shadow); }

      .header-bg-main { fill: url(#header-grad-blue); stroke: #bfdbfe; stroke-width: 1; }
      .header-bg-output { fill: url(#header-grad-green); stroke: #a7f3d0; stroke-width: 1; }
      .header-bg-eqp { fill: url(#header-grad-amber); stroke: #fde68a; stroke-width: 1; }

      .step-tag { font-size: 8px; font-weight: 700; fill: #1e40af; letter-spacing: 0.6px; }
      .step-tag-out { font-size: 8px; font-weight: 700; fill: #065f46; letter-spacing: 0.6px; }
      .step-tag-eqp { font-size: 8.5px; font-weight: 700; fill: #92400e; letter-spacing: 0.6px; }

      .card-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .card-title-out { font-size: 11.5px; font-weight: 800; fill: #064e3b; }
      .card-title-eqp { font-size: 11.5px; font-weight: 700; fill: #78350f; }

      .card-sub { font-size: 9.5px; fill: #2563eb; font-weight: 600; font-style: italic; }
      .card-sub-muted { font-size: 9px; fill: #64748b; }
      .card-desc { font-size: 9.5px; fill: #334155; }

      .eqp-desc { font-size: 9.5px; fill: #92400e; font-weight: 500; }
      .eqp-sub { font-size: 9px; fill: #b45309; font-style: italic; }

      .arrow-main { stroke: #2563eb; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-main-head); }
      .arrow-branch { stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; stroke-linecap: round; marker-end: url(#arrow-branch-head); }
    </style>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="880" height="260" fill="#ffffff" rx="10"/>

  <!-- ==================== MAIN PIPELINE NODES ==================== -->

  <!-- Node 1: Abnormal EQP (Input) [x=20..172, center=96] -->
  <g transform="translate(20, 14)">
    <rect class="node-main" width="152" height="116" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 143,0 Q 152,0 152,9 L 152,38 L 0,38 Z"/>
    <text class="step-tag" x="76" y="14" text-anchor="middle" dominant-baseline="central">STEP 1 · INPUT</text>
    <text class="card-title" x="76" y="27" text-anchor="middle" dominant-baseline="central">Abnormal EQP</text>
    <text class="card-sub-muted" x="76" y="54" text-anchor="middle" dominant-baseline="central">(Target Equipment)</text>
    <text class="card-desc" x="76" y="78" text-anchor="middle" dominant-baseline="central">Flagged by upstream</text>
    <text class="card-desc" x="76" y="96" text-anchor="middle" dominant-baseline="central">monitoring / SPC</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line class="arrow-main" x1="172" y1="72" x2="192" y2="72"/>

  <!-- Node 2: Global KPI Model [x=192..344, center=268] -->
  <g transform="translate(192, 14)">
    <rect class="node-main" width="152" height="116" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 143,0 Q 152,0 152,9 L 152,38 L 0,38 Z"/>
    <text class="step-tag" x="76" y="14" text-anchor="middle" dominant-baseline="central">STEP 2 · MODELING</text>
    <text class="card-title" x="76" y="27" text-anchor="middle" dominant-baseline="central">Global KPI Model</text>
    <text class="card-sub" x="76" y="54" text-anchor="middle" dominant-baseline="central">f(<tspan font-weight="700" font-style="normal">x</tspan>, g)</text>
    <text class="card-desc" x="76" y="78" text-anchor="middle" dominant-baseline="central">5-fold cross-fitting</text>
    <text class="card-desc" x="76" y="96" text-anchor="middle" dominant-baseline="central">all equipment pool</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line class="arrow-main" x1="344" y1="72" x2="364" y2="72"/>

  <!-- Node 3: OOF SHAP Attributions [x=364..516, center=440] -->
  <g transform="translate(364, 14)">
    <rect class="node-main" width="152" height="116" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 143,0 Q 152,0 152,9 L 152,38 L 0,38 Z"/>
    <text class="step-tag" x="76" y="14" text-anchor="middle" dominant-baseline="central">STEP 3 · ATTRIBUTION</text>
    <text class="card-title" x="76" y="27" text-anchor="middle" dominant-baseline="central">OOF SHAP Values</text>
    <text class="card-sub-muted" x="76" y="54" text-anchor="middle" dominant-baseline="central">attribution distributions</text>
    <text class="card-desc" x="76" y="78" text-anchor="middle" dominant-baseline="central">Held-out rows only</text>
    <text class="card-desc" x="76" y="96" text-anchor="middle" dominant-baseline="central">avoids in-sample bias</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line class="arrow-main" x1="516" y1="72" x2="536" y2="72"/>

  <!-- Node 4: Wasserstein Distance [x=536..688, center=612] -->
  <g transform="translate(536, 14)">
    <rect class="node-main" width="152" height="116" rx="9"/>
    <path class="header-bg-main" d="M 0,9 Q 0,0 9,0 L 143,0 Q 152,0 152,9 L 152,38 L 0,38 Z"/>
    <text class="step-tag" x="76" y="14" text-anchor="middle" dominant-baseline="central">STEP 4 · DISTANCE</text>
    <text class="card-title" x="76" y="27" text-anchor="middle" dominant-baseline="central">Wasserstein Metric</text>
    <text class="card-sub-muted" x="76" y="54" text-anchor="middle" dominant-baseline="central">distribution divergence</text>
    <text class="card-desc" x="76" y="78" text-anchor="middle" dominant-baseline="central">Abnormal vs. normal</text>
    <text class="card-desc" x="76" y="96" text-anchor="middle" dominant-baseline="central">feature-wise profiles</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line class="arrow-main" x1="688" y1="72" x2="708" y2="72"/>

  <!-- Node 5: Candidate Ranking (Output) [x=708..860, center=784] -->
  <g transform="translate(708, 14)">
    <rect class="node-output" width="152" height="116" rx="9"/>
    <path class="header-bg-output" d="M 0,9 Q 0,0 9,0 L 143,0 Q 152,0 152,9 L 152,38 L 0,38 Z"/>
    <text class="step-tag-out" x="76" y="14" text-anchor="middle" dominant-baseline="central">PRIMARY OUTPUT</text>
    <text class="card-title-out" x="76" y="27" text-anchor="middle" dominant-baseline="central">Candidate Ranking</text>
    <text class="card-sub-muted" x="76" y="54" text-anchor="middle" dominant-baseline="central">ranked process features</text>
    <text class="card-desc" x="76" y="78" text-anchor="middle" dominant-baseline="central">Known-equipment</text>
    <text class="card-desc" x="76" y="96" text-anchor="middle" dominant-baseline="central">root-cause diagnosis</text>
  </g>

  <!-- ==================== EQP BRANCH ==================== -->

  <!-- Branch arrow from Node 3 (center x=440) to EQP Box -->
  <path class="arrow-branch" d="M 440,130 L 440,158"/>

  <!-- Node EQP: Separate reported channel [x=130..750, center=440, width=620, height=86] -->
  <g transform="translate(130, 158)">
    <rect class="node-eqp" width="620" height="86" rx="9"/>
    <path class="header-bg-eqp" d="M 0,9 Q 0,0 9,0 L 611,0 Q 620,0 620,9 L 620,26 L 0,26 Z"/>
    <text class="step-tag-eqp" x="310" y="13" text-anchor="middle" dominant-baseline="central">ORTHOGONAL DIAGNOSTIC CHANNEL</text>

    <text class="card-title-eqp" x="310" y="41" text-anchor="middle" dominant-baseline="central">Equipment-Identifier (EQP) Attribution Channel</text>
    <text class="eqp-desc" x="310" y="58" text-anchor="middle" dominant-baseline="central">Model-dependent unexplained equipment-association diagnostic readout</text>
    <text class="eqp-sub" x="310" y="73" text-anchor="middle" dominant-baseline="central">Strictly separated and excluded from candidate process-feature ranking</text>
  </g>
</svg>
